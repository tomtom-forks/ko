name: ko
description: Build and publish container images from Go code with ko, running the published ko image.
author: ko Build Authors
branding:
  icon: package
  color: blue

inputs:
  importpaths:
    description: Go import paths (or relative directories) to build, one per line or space separated.
    default: .
  working-directory:
    description: Directory, relative to the workspace, ko runs in.
    default: .
  annotations:
    description: Which annotations (key=value[,key=value]) to add to the OCI manifest.
    default: ""
  labels:
    description: Which labels (key=value[,key=value]) to add to the image.
    default: ""
  refs:
    description: Path to file where a list of the published image references will be written.
    default: ""
  user:
    description: The default user the image should be run as.
    default: ""
  output:
    description: "Format of the results written to stdout: 'text' or 'json' (same shape as docker/metadata-action's json output, plus ko extras)."
    default: json
  sbom:
    description: The SBOM media type to use (none will disable SBOM synthesis and upload).
    default: spdx
  tags:
    description: Which tags to use for the produced image instead of the default 'latest' tag, comma or newline separated (may not work properly with bare or base-import-paths).
    default: latest
  ldflags:
    description: ldflags to pass to go build, one set per line.
    default: ""
  platform:
    description: "Which platform to use when pulling a multi-platform base. Format: all | <os>[/<arch>[/<variant>]][,platform]*"
    default: ""
  push:
    description: Push images to the registry (true/false).
    default: "true"
  bare:
    description: Whether to just use KO_DOCKER_REPO without additional context (true/false).
    default: "false"
  base-import-paths:
    description: Whether to use the base path without MD5 hash after KO_DOCKER_REPO (true/false).
    default: "false"
  preserve-import-paths:
    description: Whether to preserve the full import path after KO_DOCKER_REPO (true/false).
    default: "false"
  tag-only:
    description: Include tags but not digests in resolved image references (true/false).
    default: "false"
  insecure-registry:
    description: Whether to skip TLS verification on the registry (true/false).
    default: "false"
  disable-optimizations:
    description: Disable optimizations when building Go code (true/false).
    default: "false"
  sbom-dir:
    description: Path to directory where the SBOM will be written.
    default: ""
  oci-layout-path:
    description: Path to save the OCI image layout of the built images.
    default: ""
  tarball:
    description: File to save images tarballs.
    default: ""
  jobs:
    description: The maximum number of concurrent builds.
    default: ""
  docker-repo:
    description: Registry to publish to (KO_DOCKER_REPO). Falls back to the KO_DOCKER_REPO environment variable.
    default: ""
  config-path:
    description: Directory holding .ko.yaml (KO_CONFIG_PATH). Falls back to the KO_CONFIG_PATH environment variable.
    default: ""
  default-base-image:
    description: Default base image (KO_DEFAULTBASEIMAGE). Falls back to the KO_DEFAULTBASEIMAGE environment variable.
    default: ""
  default-platforms:
    description: Default platforms (KO_DEFAULTPLATFORMS). Falls back to the KO_DEFAULTPLATFORMS environment variable.
    default: ""
  data-date-epoch:
    description: Timestamp of files under kodata (KO_DATA_DATE_EPOCH). Falls back to the KO_DATA_DATE_EPOCH environment variable.
    default: ""
  registry:
    description: Registry to log in to before building, e.g. ghcr.io. Used with username and password.
    default: ""
  username:
    description: Username to log in to the registry with.
    default: ""
  password:
    description: Password or token to log in to the registry with. Skips the login when empty.
    default: ""

outputs:
  json:
    description: The whole JSON document ko wrote to stdout. Empty unless output is json.
  tags:
    description: The "tags" of the JSON document, as a JSON array of repo:tag strings.
  digest:
    description: The digest of the first image of the JSON document.

runs:
  using: docker
  image: Dockerfile
